<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="HandheldFriendly" content="true">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1a1a2e">
    <title>Phyllotaxis - Mistral's Version</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
            touch-action: manipulation;
        }
        
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            background: #1a1a2e;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        
        #canvas-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            z-index: 10;
        }
        
        .header {
            pointer-events: none;
            text-align: center;
        }
        
        .header h1 {
            color: #e94560;
            font-size: clamp(1.5rem, 5vw, 2.5rem);
            font-weight: 700;
            margin: 0;
            text-shadow: 0 2px 10px rgba(233, 69, 96, 0.5);
        }
        
        .header p {
            color: #f1f1f1;
            font-size: clamp(0.8rem, 3vw, 1rem);
            opacity: 0.8;
            margin: 5px 0 0 0;
        }
        
        .instructions {
            pointer-events: auto;
            background: rgba(26, 26, 46, 0.9);
            padding: 15px 20px;
            border-radius: 12px;
            border: 1px solid rgba(233, 69, 96, 0.3);
            max-width: 90%;
            text-align: center;
        }
        
        .instructions h3 {
            color: #e94560;
            font-size: clamp(0.9rem, 3vw, 1.1rem);
            margin: 0 0 10px 0;
        }
        
        .instructions p {
            color: #f1f1f1;
            font-size: clamp(0.75rem, 2.5vw, 0.9rem);
            line-height: 1.5;
            margin: 5px 0;
            opacity: 0.9;
        }
        
        @media (min-width: 768px) {
            .instructions {
                padding: 20px 25px;
            }
        }
        
        /* Touch feedback for mobile */
        @media (hover: none) and (pointer: coarse) {
            .instructions {
                padding: 18px 22px;
            }
        }
    </style>
</head>
<body>
    <div id="canvas-container">
        <div class="ui-overlay">
            <div class="header">
                <h1>Phyllotaxis Pattern</h1>
                <p>Mistral's Version - Generative Sunflower Pattern</p>
            </div>
            <div class="instructions">
                <h3>How to Interact</h3>
                <p><strong>Tap anywhere</strong> to change color mode</p>
                <p>Press <strong>'S'</strong> on keyboard to save image</p>
                <p>Current mode: <span id="mode-text">Golden</span></p>
            </div>
        </div>
    </div>
    <script src="phyllotaxis.js"></script>
    <script>
      // Place canvas inside the container
      document.addEventListener('DOMContentLoaded', function() {
        const container = document.getElementById('canvas-container');
        const canvas = document.querySelector('canvas');
        if (canvas && container) {
          container.insertBefore(canvas, container.firstChild);
        }
      });
    </script>
</body>
</html>
